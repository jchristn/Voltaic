name: Tests

# Runs the full test complement on every commit to any branch and on every pull request: the shared
# Touchstone suite through the console, xUnit, and NUnit runners, and the Native AOT smoke test's checks
# under the JIT (reflection-based JSON is off in that project). The native binaries are published and run
# by native-aot.yml.

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        framework: [ net8.0, net10.0 ]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        id: build
        run: dotnet build src/Voltaic.sln -c Release

      - name: Touchstone console runner
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/Test.Automated/Test.Automated.csproj -c Release -f ${{ matrix.framework }} --no-build -- --results artifacts/test-results/touchstone.json | tee artifacts-console.txt
          grep -Eq "^Total: [0-9]+ +Passed: [0-9]+ +Failed: 0 " artifacts-console.txt

      - name: xUnit adapter
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test src/Test.Xunit/Test.Xunit.csproj -c Release -f ${{ matrix.framework }} --no-build --logger "trx;LogFileName=xunit.trx" --results-directory artifacts/test-results

      - name: NUnit adapter
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test src/Test.Nunit/Test.Nunit.csproj -c Release -f ${{ matrix.framework }} --no-build --logger "trx;LogFileName=nunit.trx" --results-directory artifacts/test-results

      - name: Native AOT checks under the JIT
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet run --project src/Test.Aot/Test.Aot.csproj -c Release -f ${{ matrix.framework }} --no-build

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.framework }}
          path: |
            artifacts/test-results
            artifacts-console.txt
          if-no-files-found: ignore
